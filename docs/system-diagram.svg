<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1240 760" width="1240" height="760">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#090e1a"/>
      <stop offset="100%" stop-color="#111a2e"/>
    </linearGradient>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 1 L 10 5 L 0 9 z" fill="#38bdf8"/>
    </marker>
    <marker id="arrowWarn" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 1 L 10 5 L 0 9 z" fill="#f59e0b"/>
    </marker>
  </defs>

  <rect width="1240" height="760" fill="url(#bg)"/>
  <text x="40" y="48" fill="#f8fafc" font-family="Segoe UI, Arial, sans-serif" font-size="26" font-weight="700">DualLoop — Autonomous Dual-AI Full-Loop Architecture</text>
  <text x="40" y="74" fill="#94a3b8" font-family="Segoe UI, Arial, sans-serif" font-size="14">Zero-Dependency Node.js 24 · PM2 · 10 AI Providers · 3NF Relational DB · 4-Layer Verify · Telegram &amp; Web Dashboard</text>

  <!-- Row 1: Control Channels -->
  <rect x="40" y="105" width="250" height="110" rx="12" fill="#131e36" stroke="#38bdf8" stroke-width="2"/>
  <text x="60" y="135" fill="#38bdf8" font-family="Segoe UI, Arial" font-size="15" font-weight="700">1. User Channels</text>
  <text x="60" y="160" fill="#e2e8f0" font-family="Segoe UI, Arial" font-size="13">• Telegram Bot (Buttons/Voice/Img)</text>
  <text x="60" y="180" fill="#e2e8f0" font-family="Segoe UI, Arial" font-size="13">• Web Dashboard (:4099)</text>
  <text x="60" y="200" fill="#e2e8f0" font-family="Segoe UI, Arial" font-size="13">• CLI (npx) &amp; IDE SKILL.md</text>

  <!-- Orchestrator -->
  <rect x="360" y="105" width="320" height="110" rx="12" fill="#152442" stroke="#60a5fa" stroke-width="2"/>
  <text x="380" y="135" fill="#60a5fa" font-family="Segoe UI, Arial" font-size="15" font-weight="700">2. Orchestrator &amp; Job Queue</text>
  <text x="380" y="160" fill="#e2e8f0" font-family="Segoe UI, Arial" font-size="13">• Sequential Job Queue + Auto-Resume</text>
  <text x="380" y="180" fill="#e2e8f0" font-family="Segoe UI, Arial" font-size="13">• Budget Cap (MAX_AI_CALLS) + Cancel</text>
  <text x="380" y="200" fill="#e2e8f0" font-family="Segoe UI, Arial" font-size="13">• Templates &amp; PROJECT_RULES.md</text>

  <!-- State & Contracts -->
  <rect x="750" y="105" width="450" height="110" rx="12" fill="#131e36" stroke="#a78bfa" stroke-width="2"/>
  <text x="770" y="135" fill="#a78bfa" font-family="Segoe UI, Arial" font-size="15" font-weight="700">3. Workspace &amp; Single Source of Truth (~/Desktop/&lt;slug&gt;)</text>
  <text x="770" y="160" fill="#e2e8f0" font-family="Segoe UI, Arial" font-size="13">• STATE.json (tasks, blockedQuestions, metrics) + SPEC.md</text>
  <text x="770" y="180" fill="#e2e8f0" font-family="Segoe UI, Arial" font-size="13">• DB_SCHEMA.sql (3NF + FK + ON DELETE + Indexes + Auto Seed)</text>
  <text x="770" y="200" fill="#e2e8f0" font-family="Segoe UI, Arial" font-size="13">• API_CONTRACT.json (Backend/Frontend lock) + Git &amp; DB Snapshot</text>

  <line x1="290" y1="160" x2="358" y2="160" stroke="#38bdf8" stroke-width="2" marker-end="url(#arrow)"/>
  <line x1="680" y1="160" x2="748" y2="160" stroke="#38bdf8" stroke-width="2" marker-end="url(#arrow)"/>

  <!-- Row 2: 4-Phase Pipeline -->
  <rect x="40" y="265" width="260" height="150" rx="12" fill="#122138" stroke="#22d3ee" stroke-width="2"/>
  <text x="60" y="295" fill="#22d3ee" font-family="Segoe UI, Arial" font-size="15" font-weight="700">Phase 1/4: Clarify</text>
  <text x="60" y="320" fill="#cbd5e1" font-family="Segoe UI, Arial" font-size="13">• grill-me + Ponytail rules</text>
  <text x="60" y="342" fill="#cbd5e1" font-family="Segoe UI, Arial" font-size="13">• Clickable choice-only Q&amp;A</text>
  <text x="60" y="364" fill="#cbd5e1" font-family="Segoe UI, Arial" font-size="13">• UI Theme Preset picker</text>
  <text x="60" y="386" fill="#cbd5e1" font-family="Segoe UI, Arial" font-size="13">• Outputs Contracts &amp; Tasks</text>

  <rect x="340" y="265" width="240" height="150" rx="12" fill="#122138" stroke="#34d399" stroke-width="2"/>
  <text x="360" y="295" fill="#34d399" font-family="Segoe UI, Arial" font-size="15" font-weight="700">Phase 2/4: Checkpoint</text>
  <text x="360" y="320" fill="#cbd5e1" font-family="Segoe UI, Arial" font-size="13">• OS real free-port allocation</text>
  <text x="360" y="342" fill="#cbd5e1" font-family="Segoe UI, Arial" font-size="13">• Git checkpoint commit</text>
  <text x="360" y="364" fill="#cbd5e1" font-family="Segoe UI, Arial" font-size="13">• SQLite DB Snapshot backup</text>
  <text x="360" y="386" fill="#cbd5e1" font-family="Segoe UI, Arial" font-size="13">• Safe /rollback restore</text>

  <rect x="620" y="265" width="280" height="150" rx="12" fill="#122138" stroke="#818cf8" stroke-width="2"/>
  <text x="640" y="295" fill="#818cf8" font-family="Segoe UI, Arial" font-size="15" font-weight="700">Phase 3/4: Dual-AI Build</text>
  <text x="640" y="320" fill="#cbd5e1" font-family="Segoe UI, Arial" font-size="13">• Backend AI: DB/API/Tests/Seed</text>
  <text x="640" y="342" fill="#cbd5e1" font-family="Segoe UI, Arial" font-size="13">• Frontend AI: HTML/CSS/JS/E2E</text>
  <text x="640" y="364" fill="#cbd5e1" font-family="Segoe UI, Arial" font-size="13">• Skip-on-Block + Schema Guard</text>
  <text x="640" y="386" fill="#cbd5e1" font-family="Segoe UI, Arial" font-size="13">• Phase 3.5 Cross-AI Review</text>

  <rect x="940" y="265" width="260" height="150" rx="12" fill="#122138" stroke="#22c55e" stroke-width="2"/>
  <text x="960" y="295" fill="#22c55e" font-family="Segoe UI, Arial" font-size="15" font-weight="700">Phase 4/4: 4-Layer Verify</text>
  <text x="960" y="320" fill="#cbd5e1" font-family="Segoe UI, Arial" font-size="13">1. Security (Secrets &amp; SQLi)</text>
  <text x="960" y="342" fill="#cbd5e1" font-family="Segoe UI, Arial" font-size="13">2. PM2 online + pm2 save</text>
  <text x="960" y="364" fill="#cbd5e1" font-family="Segoe UI, Arial" font-size="13">3. DB FK/CRUD + API Contract</text>
  <text x="960" y="386" fill="#cbd5e1" font-family="Segoe UI, Arial" font-size="13">4. Chrome CDP (1280/390 + PNG)</text>

  <line x1="520" y1="215" x2="170" y2="263" stroke="#38bdf8" stroke-width="2" marker-end="url(#arrow)"/>
  <line x1="300" y1="340" x2="338" y2="340" stroke="#38bdf8" stroke-width="2" marker-end="url(#arrow)"/>
  <line x1="580" y1="340" x2="618" y2="340" stroke="#38bdf8" stroke-width="2" marker-end="url(#arrow)"/>
  <line x1="900" y1="340" x2="938" y2="340" stroke="#38bdf8" stroke-width="2" marker-end="url(#arrow)"/>
  <path d="M 1070 415 L 1070 450 L 760 450 L 760 417" fill="none" stroke="#f59e0b" stroke-width="2" stroke-dasharray="6 4" marker-end="url(#arrowWarn)"/>
  <text x="805" y="444" fill="#fbbf24" font-family="Segoe UI, Arial" font-size="12">Self-Healing Fix Loop (max 4) -&gt; Circuit Breaker</text>

  <!-- Row 3: Universal AI Providers & Production Ops -->
  <rect x="40" y="490" width="560" height="220" rx="12" fill="#131c31" stroke="#38bdf8" stroke-width="1.5"/>
  <text x="60" y="520" fill="#38bdf8" font-family="Segoe UI, Arial" font-size="15" font-weight="700">Universal AI Adapter &amp; Auto-Fallback (src/ai.js)</text>
  <text x="60" y="550" fill="#e2e8f0" font-family="Segoe UI, Arial" font-size="13">• Local CLIs: claude-cli (Team/Pro) · agy (Google AI Ultra) · gemini-cli · codex-cli</text>
  <text x="60" y="575" fill="#e2e8f0" font-family="Segoe UI, Arial" font-size="13">• Cloud APIs: anthropic · gemini (multimodal) · openai · openrouter (all models)</text>
  <text x="60" y="600" fill="#e2e8f0" font-family="Segoe UI, Arial" font-size="13">• Local/Custom: ollama (127.0.0.1:11434) · custom (DeepSeek, Groq, vLLM)</text>
  <text x="60" y="630" fill="#94a3b8" font-family="Segoe UI, Arial" font-size="13">• Guardrails: CLI_TIMEOUT_MS (180s), AUTO_FALLBACK chain, Ponytail prompts</text>
  <text x="60" y="655" fill="#94a3b8" font-family="Segoe UI, Arial" font-size="13">• Migration Guard: idempotent ALTER TABLE on /continue (zero data loss)</text>
  <text x="60" y="680" fill="#94a3b8" font-family="Segoe UI, Arial" font-size="13">• Live Switch: /model &lt;backend|frontend&gt; [provider] &lt;model-id&gt;</text>

  <rect x="640" y="490" width="560" height="220" rx="12" fill="#131c31" stroke="#22c55e" stroke-width="1.5"/>
  <text x="660" y="520" fill="#22c55e" font-family="Segoe UI, Arial" font-size="15" font-weight="700">Production Runtime, Monitoring &amp; Delivery</text>
  <text x="660" y="550" fill="#e2e8f0" font-family="Segoe UI, Arial" font-size="13">• PM2 Crash Watchdog (45s poll) -&gt; Telegram [Restart] / [AI Fix]</text>
  <text x="660" y="575" fill="#e2e8f0" font-family="Segoe UI, Arial" font-size="13">• Daily 24h Health &amp; Disk Report + /health + /stats</text>
  <text x="660" y="600" fill="#e2e8f0" font-family="Segoe UI, Arial" font-size="13">• /db &lt;slug&gt;: SQLite table/row counts &amp; .db backup download</text>
  <text x="660" y="625" fill="#e2e8f0" font-family="Segoe UI, Arial" font-size="13">• /env &lt;slug&gt; [K=V]: masked view &amp; live update + PM2 restart</text>
  <text x="660" y="650" fill="#e2e8f0" font-family="Segoe UI, Arial" font-size="13">• /tunnel (cloudflared/zrok), /domain (Nginx/Caddy), /export (.zip / gh)</text>
  <text x="660" y="675" fill="#e2e8f0" font-family="Segoe UI, Arial" font-size="13">• Auto-Push git origin after verify + /update self-updater</text>
</svg>
