<!DOCTYPE html>
<html lang="th">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>DualLoop Control Dashboard</title>
  <style>
    :root {
      --bg:#f8fafc; --card:#ffffff; --line:#e2e8f0; --text:#0f172a; --muted:#475569;
      --input:#f8fafc; --btn:#f1f5f9; --pre:#f1f5f9; --ok:#16a34a; --warn:#d97706; --err:#dc2626; --acc:#0284c7;
    }
    [data-theme="dark"] {
      --bg:#0b1020; --card:#131b31; --line:#233054; --text:#e7edf8; --muted:#95a3c3;
      --input:#0c1324; --btn:#1c294a; --pre:#080c18; --ok:#22c55e; --warn:#f59e0b; --err:#ef4444; --acc:#38bdf8;
    }
    * { box-sizing:border-box; }
    body { margin:0; font-family:system-ui,-apple-system,sans-serif; background:var(--bg); color:var(--text); padding:20px; transition:background .15s,color .15s; }
    .wrap { max-width:1200px; margin:0 auto; }
    header { display:flex; flex-wrap:wrap; gap:12px; justify-content:space-between; align-items:center; margin-bottom:18px; }
    h1 { margin:0; font-size:22px; }
    .meta { color:var(--muted); font-size:13px; }
    .panel { background:var(--card); border:1px solid var(--line); border-radius:12px; padding:14px; margin-bottom:16px; box-shadow:0 1px 3px rgba(0,0,0,.04); }
    .row { display:flex; flex-wrap:wrap; gap:8px; align-items:center; }
    input, select, button { background:var(--input); color:var(--text); border:1px solid var(--line); border-radius:8px; padding:7px 10px; font-size:13px; }
    input { flex:1; min-width:140px; }
    button { cursor:pointer; background:var(--btn); font-weight:600; }
    button:hover { border-color:var(--acc); }
    button.primary { background:#0284c7; border-color:#0284c7; color:#fff; }
    button.danger { background:#dc2626; border-color:#dc2626; color:#fff; }
    .grid { display:grid; grid-template-columns:repeat(auto-fill,minmax(340px,1fr)); gap:14px; }
    .badge { display:inline-block; padding:2px 8px; border-radius:999px; font-size:11px; font-weight:700; text-transform:uppercase; }
    .online { background:rgba(22,163,74,.14); color:var(--ok); }
    .warn { background:rgba(217,119,6,.14); color:var(--warn); }
    .err { background:rgba(220,38,38,.14); color:var(--err); }
    img.preview { width:100%; max-height:170px; object-fit:cover; border-radius:8px; border:1px solid var(--line); margin-top:10px; background:var(--pre); }
    pre { background:var(--pre); border:1px solid var(--line); border-radius:8px; padding:10px; font-size:12px; overflow:auto; max-height:240px; white-space:pre-wrap; }
    table { width:100%; border-collapse:collapse; font-size:12px; margin-bottom:12px; }
    th, td { text-align:left; padding:6px 8px; border-bottom:1px solid var(--line); }
    .actions { display:flex; flex-wrap:wrap; gap:6px; margin-top:10px; }
  </style>
</head>
<body>
  <div class="wrap">
    <header>
      <div>
        <h1>⚡ DualLoop Control Dashboard</h1>
        <div id="sysMeta" class="meta">Loading...</div>
      </div>
      <div class="row">
        <a href="/docs/architecture.html" target="_blank" style="color:var(--acc);font-size:13px;text-decoration:none;font-weight:600;">Architecture Diagram ↗</a>
        <button id="langBtn" onclick="toggleLang()">🌐 TH</button>
        <button id="themeBtn" onclick="toggleTheme()">🌙 Dark</button>
        <button onclick="loadData()">↻ Refresh</button>
      </div>
    </header>

    <div class="panel">
      <div class="row" style="margin-bottom:10px;">
        <input id="appName" placeholder="ชื่อโปรเจกต์ (เช่น todo-app)" />
        <input id="appConcept" placeholder="อธิบาย Concept โปรแกรม..." style="flex:2;" />
        <button id="btnCreate" class="primary" onclick="createNew()">+ สร้างโปรเจกต์ใหม่</button>
      </div>
      <div class="row" style="border-top:1px solid var(--line);padding-top:10px;">
        <span class="meta">Backend:</span>
        <select id="beProv"><option>claude-cli</option><option>anthropic</option><option>codex-cli</option><option>openai</option><option>openrouter</option><option>ollama</option><option>custom</option></select>
        <input id="beModel" placeholder="Backend Model" style="max-width:190px;" />
        <span class="meta">Frontend:</span>
        <select id="feProv"><option>agy</option><option>gemini-cli</option><option>gemini</option><option>claude-cli</option><option>openai</option><option>openrouter</option><option>ollama</option><option>custom</option></select>
        <input id="feModel" placeholder="Frontend Model" style="max-width:190px;" />
        <label class="meta" style="display:flex;align-items:center;gap:4px;"><input type="checkbox" id="autoFb" style="min-width:auto;flex:0;" /> Auto-Fallback</label>
        <button id="btnSaveAi" onclick="saveAiConfig()">บันทึก AI</button>
      </div>
    </div>

    <div id="questionBanner" class="panel" style="display:none;border-color:var(--warn);"></div>

    <div id="projectsGrid" class="grid"></div>

    <div id="inspectorBox" class="panel" style="display:none; margin-top:16px;">
      <div class="row" style="justify-content:space-between;margin-bottom:8px;">
        <strong id="inspectorTitle">Inspector</strong>
        <button onclick="document.getElementById('inspectorBox').style.display='none'">ปิด</button>
      </div>
      <div id="inspectorBody"></div>
    </div>

    <div class="panel" style="margin-top:16px;">
      <div class="row" style="justify-content:space-between;margin-bottom:8px;">
        <strong>📡 Live Activity Feed (Phase 1 → 4)</strong>
        <button onclick="document.getElementById('feedBox').textContent=''">Clear</button>
      </div>
      <pre id="feedBox" style="max-height:190px;"></pre>
    </div>
  </div>

  <script>
    const UI_TXT = {
      th: {
        namePh: 'ชื่อโปรเจกต์ (เช่น todo-app)',
        conceptPh: 'อธิบาย Concept โปรแกรม...',
        create: '+ สร้างโปรเจกต์ใหม่',
        saveAi: 'บันทึก AI',
        savedAi: 'บันทึกค่า AI ชั่วคราวแล้ว',
        empty: 'ยังไม่มีโปรเจกต์ (สร้างด้านบนหรือพิมพ์ /new ใน Telegram)',
        qTitle: '❓ คำถามรอคำตอบ:',
        customBtn: '✏️ พิมพ์ตอบเอง',
        cancelBtn: '❌ ยกเลิก',
        contPrompt: 'สั่งแก้/เพิ่มฟีเจอร์ให้',
        delConfirm: 'ลบ',
        noDb: 'ไม่พบไฟล์ SQLite (.db)',
        feedTitle: '📡 Live Activity Feed (Phase 1 → 4)'
      },
      en: {
        namePh: 'Project name (e.g. todo-app)',
        conceptPh: 'Describe your app concept...',
        create: '+ New Project',
        saveAi: 'Save AI',
        savedAi: 'AI config updated for this session',
        empty: 'No projects yet (create above or send /new on Telegram)',
        qTitle: '❓ Pending Question:',
        customBtn: '✏️ Custom Answer',
        cancelBtn: '❌ Cancel',
        contPrompt: 'Describe new feature or fix for',
        delConfirm: 'Delete',
        noDb: 'No SQLite (.db) file found',
        feedTitle: '📡 Live Activity Feed (Phase 1 → 4)'
      }
    };
    let curLang = localStorage.getItem('dualloop-lang') || 'th';
    function applyLang(l) {
      curLang = l === 'en' ? 'en' : 'th';
      localStorage.setItem('dualloop-lang', curLang);
      const u = UI_TXT[curLang];
      document.getElementById('langBtn').textContent = curLang === 'en' ? '🌐 EN' : '🌐 TH';
      document.getElementById('appName').placeholder = u.namePh;
      document.getElementById('appConcept').placeholder = u.conceptPh;
      document.getElementById('btnCreate').textContent = u.create;
      document.getElementById('btnSaveAi').textContent = u.saveAi;
    }
    async function toggleLang() {
      const next = curLang === 'en' ? 'th' : 'en';
      applyLang(next);
      await fetch('/api/lang', {
        method: 'POST',
        headers: { 'content-type': 'application/json' },
        body: JSON.stringify({ lang: next })
      });
      loadData();
    }
    applyLang(curLang);

    function applyTheme(t) {
      document.documentElement.setAttribute('data-theme', t);
      localStorage.setItem('dualloop-theme', t);
      document.getElementById('themeBtn').textContent = t === 'dark' ? '☀️ Light' : '🌙 Dark';
    }
    function toggleTheme() {
      const cur = document.documentElement.getAttribute('data-theme') || 'light';
      applyTheme(cur === 'dark' ? 'light' : 'dark');
    }
    applyTheme(localStorage.getItem('dualloop-theme') || 'light');

    async function loadAiConfig() {
      const r = await fetch('/api/ai-config');
      if (!r.ok) return;
      const c = await r.json();
      document.getElementById('beProv').value = c.backendProvider;
      document.getElementById('beModel').value = c.backendModel;
      document.getElementById('feProv').value = c.frontendProvider;
      document.getElementById('feModel').value = c.frontendModel;
      document.getElementById('autoFb').checked = Boolean(c.autoFallback);
    }

    async function saveAiConfig() {
      const r = await fetch('/api/ai-config', {
        method: 'POST',
        headers: { 'content-type': 'application/json' },
        body: JSON.stringify({
          backendProvider: document.getElementById('beProv').value,
          backendModel: document.getElementById('beModel').value.trim(),
          frontendProvider: document.getElementById('feProv').value,
          frontendModel: document.getElementById('feModel').value.trim(),
          autoFallback: document.getElementById('autoFb').checked
        })
      });
      if (r.ok) alert(UI_TXT[curLang].savedAi);
    }

    async function act(slug, action) {
      const r = await fetch('/api/action', {
        method: 'POST',
        headers: { 'content-type': 'application/json' },
        body: JSON.stringify({ slug, action })
      });
      const j = await r.json();
      if (!r.ok) alert(j.error || 'Failed');
      loadData();
    }

    async function viewLogs(slug) {
      const r = await fetch(`/api/logs/${encodeURIComponent(slug)}`);
      const j = await r.json();
      document.getElementById('inspectorTitle').textContent = `PM2 Logs: ${slug}`;
      document.getElementById('inspectorBody').innerHTML = `<pre>${esc(j.logs || '(empty)')}</pre>`;
      document.getElementById('inspectorBox').style.display = 'block';
    }

    async function viewDb(slug) {
      const r = await fetch(`/api/db/${encodeURIComponent(slug)}`);
      const j = await r.json();
      document.getElementById('inspectorTitle').textContent = `🗄️ DB Viewer: ${slug} (${j.dbFile || 'no SQLite'})`;
      if (!j.found) {
        document.getElementById('inspectorBody').innerHTML = `<div class="meta">${UI_TXT[curLang].noDb}</div>`;
      } else {
        document.getElementById('inspectorBody').innerHTML = j.tables.map(t => {
          if (!t.rows.length) return `<h4>${esc(t.name)} (0 rows)</h4>`;
          const cols = Object.keys(t.rows[0]);
          return `<h4>${esc(t.name)} (${t.rows.length} rows shown)</h4><div style="overflow:auto;"><table><tr>${cols.map(c => `<th>${esc(c)}</th>`).join('')}</tr>` +
            t.rows.map(row => `<tr>${cols.map(c => `<td>${esc(row[c])}</td>`).join('')}</tr>`).join('') + '</table></div>';
        }).join('');
      }
      document.getElementById('inspectorBox').style.display = 'block';
    }

    async function createNew() {
      const name = document.getElementById('appName').value.trim();
      const concept = document.getElementById('appConcept').value.trim();
      if (!name) return alert('กรุณาใส่ชื่อโปรเจกต์');
      const r = await fetch('/api/new', {
        method: 'POST',
        headers: { 'content-type': 'application/json' },
        body: JSON.stringify({ name, concept: concept || name })
      });
      const j = await r.json();
      if (!r.ok) return alert(j.error || 'Failed');
      document.getElementById('appName').value = '';
      document.getElementById('appConcept').value = '';
      loadData();
    }

    async function openContinue(slug) {
      const instruction = prompt(`${UI_TXT[curLang].contPrompt} ${slug}:`);
      if (!instruction) return;
      const r = await fetch('/api/continue', {
        method: 'POST',
        headers: { 'content-type': 'application/json' },
        body: JSON.stringify({ slug, instruction })
      });
      if (!r.ok) alert('Failed');
      loadData();
    }

    async function openMeta(slug) {
      const r = await fetch(`/api/project-meta/${encodeURIComponent(slug)}`);
      const j = await r.json();
      const input = prompt(
        `[${slug}]\n.env:\n${j.envMasked}\n\nRules:\n${j.rules || '(none)'}\n\nพิมพ์ KEY=VALUE เพื่อแก้ .env หรือ rule:ข้อความ เพื่อเพิ่มกฎ:`
      );
      if (!input) return;
      const body = { slug };
      if (input.startsWith('rule:')) body.rule = input.slice(5).trim();
      else if (input.includes('=')) {
        const eq = input.indexOf('=');
        body.envKey = input.slice(0, eq).trim();
        body.envVal = input.slice(eq + 1).trim();
      } else body.rule = input;
      await fetch('/api/project-meta', {
        method: 'POST',
        headers: { 'content-type': 'application/json' },
        body: JSON.stringify(body)
      });
      loadData();
    }

    let activeQuestion = null;
    function renderQuestions(list) {
      activeQuestion = list && list.length ? list[0] : null;
      const box = document.getElementById('questionBanner');
      if (!activeQuestion) { box.style.display = 'none'; return; }
      const q = activeQuestion;
      box.style.display = 'block';
      const opts = q.options.map((o, i) =>
        q.allowMultiple
          ? `<label style="display:block;margin:4px 0;"><input type="checkbox" name="qopt" value="${esc(o)}"/> ${esc(o)}</label>`
          : `<button class="primary" onclick="submitWebAns('${q.id}', ${i})">${esc(o)}</button>`
      ).join(' ');
      box.innerHTML = `
        <div style="margin-bottom:8px;"><strong>${UI_TXT[curLang].qTitle}</strong> ${esc(q.question)}</div>
        <div class="row" style="gap:8px;">
          ${opts}
          ${q.allowMultiple ? `<button class="primary" onclick="submitWebMulti('${q.id}')">Submit</button>` : ''}
          ${q.allowCustom ? `<button onclick="submitWebCustom('${q.id}')">${UI_TXT[curLang].customBtn}</button>` : ''}
          ${q.allowCancel ? `<button class="danger" onclick="submitWebCancel('${q.id}')">${UI_TXT[curLang].cancelBtn}</button>` : ''}
        </div>`;
    }

    async function sendWebAns(id, answer, cancel = false) {
      await fetch('/api/answer', {
        method: 'POST',
        headers: { 'content-type': 'application/json' },
        body: JSON.stringify({ id, answer, cancel })
      });
      loadData();
    }
    function submitWebAns(id, idx) { sendWebAns(id, activeQuestion.options[idx]); }
    function submitWebMulti(id) {
      const vals = [...document.querySelectorAll('input[name="qopt"]:checked')].map(el => el.value);
      sendWebAns(id, vals.length ? vals.join(', ') : activeQuestion.options[0]);
    }
    function submitWebCustom(id) {
      const txt = prompt(activeQuestion.question);
      if (txt) sendWebAns(id, txt);
    }
    function submitWebCancel(id) { sendWebAns(id, '', true); }

    async function loadData() {
      const res = await fetch('/api/projects');
      const data = await res.json();
      if (data.lang && data.lang !== curLang) applyLang(data.lang);
      renderQuestions(data.pendingQuestions || []);
      document.getElementById('sysMeta').textContent =
        `Queue: ${data.queueSize} | Running: ${data.running ? 'YES' : 'IDLE'} | Disk: ${data.disk} | Updated: ${new Date().toLocaleTimeString()}`;

      const grid = document.getElementById('projectsGrid');
      if (!data.projects.length) {
        grid.innerHTML = `<div class="panel">${UI_TXT[curLang].empty}</div>`;
        return;
      }

      grid.innerHTML = data.projects.map(p => {
        const cls = p.pm2Status === 'online' ? 'online' : (p.phase === 'error' ? 'err' : 'warn');
        return `
          <div class="panel">
            <div class="row" style="justify-content:space-between;">
              <strong>${esc(p.name)}</strong>
              <span class="badge ${cls}">${esc(p.phase)} / ${esc(p.pm2Status)}</span>
            </div>
            <div class="meta" style="margin:6px 0;">
              Slug: <code>${esc(p.slug)}</code> · Port: <a href="http://127.0.0.1:${p.port}" target="_blank" style="color:var(--acc)">${p.port}</a><br/>
              BE calls: ${p.metrics?.aiCalls?.backend || 0} · FE calls: ${p.metrics?.aiCalls?.frontend || 0} · Fix: ${p.metrics?.totalFixLoops || 0}
            </div>
            ${p.hasPreview ? `<img class="preview" src="/api/preview/${encodeURIComponent(p.slug)}?t=${Date.now()}" alt="preview"/>` : ''}
            <div class="actions">
              <button onclick="act('${p.slug}','restart')">Restart</button>
              <button onclick="act('${p.slug}','stop')">Stop</button>
              <button onclick="act('${p.slug}','resume')">Resume</button>
              <button onclick="openContinue('${p.slug}')">+ Continue</button>
              <button onclick="viewDb('${p.slug}')">DB</button>
              <button onclick="openMeta('${p.slug}')">Env &amp; Rules</button>
              <button onclick="viewLogs('${p.slug}')">Logs</button>
              <button onclick="window.open('/api/project-docs/${encodeURIComponent(p.slug)}/architecture.html','_blank')">Flow/Docs</button>
              <button onclick="window.open('/api/project-docs/${encodeURIComponent(p.slug)}/api-tester.html','_blank')">API Tester</button>
              <button onclick="window.open('/api/project-docs/${encodeURIComponent(p.slug)}/test-report.html','_blank')">Test Report</button>
              <button onclick="act('${p.slug}','rollback')">Rollback</button>
              <button class="danger" onclick="if(confirm('${UI_TXT[curLang].delConfirm} ${p.slug}?')) act('${p.slug}','delete')">Delete</button>
            </div>
          </div>`;
      }).join('');
    }

    function esc(s) {
      return String(s || '').replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
    }

    loadAiConfig();
    loadData();
    setInterval(loadData, 15000);

    let reloadTimer = null;
    const scheduleReload = () => {
      clearTimeout(reloadTimer);
      reloadTimer = setTimeout(loadData, 600);
    };

    const es = new EventSource('/api/events');
    es.onmessage = (ev) => {
      const item = JSON.parse(ev.data);
      if (item.type === 'question' || item.type === 'question_resolved') {
        scheduleReload();
        return;
      }
      const box = document.getElementById('feedBox');
      box.textContent += `[${item.ts.slice(11, 19)}] ${item.msg}\n`;
      box.scrollTop = box.scrollHeight;
      scheduleReload();
    };
  </script>
</body>
</html>
