<!DOCTYPE html>
<html lang="th">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>DualLoop Control Dashboard</title>
  <style>
    :root {
      --bg:#f4f7fb; --card:#ffffff; --card2:#f8fafc; --line:#e2e8f0; --text:#0f172a; --muted:#64748b;
      --input:#ffffff; --btn:#f1f5f9; --btn-hover:#e2e8f0; --pre:#0f172a; --pre-text:#e2e8f0;
      --ok:#16a34a; --ok-bg:#dcfce7; --warn:#d97706; --warn-bg:#fef3c7; --err:#dc2626; --err-bg:#fee2e2;
      --acc:#2563eb; --acc-soft:#eff6ff; --shadow:0 1px 3px rgba(15,23,42,.06), 0 1px 2px rgba(15,23,42,.04);
    }
    [data-theme="dark"] {
      --bg:#080d1a; --card:#10182b; --card2:#152038; --line:#1e2c4a; --text:#f1f5f9; --muted:#94a3b8;
      --input:#0b1222; --btn:#1a2744; --btn-hover:#23345b; --pre:#060a14; --pre-text:#cbd5e1;
      --ok:#22c55e; --ok-bg:rgba(34,197,94,.16); --warn:#f59e0b; --warn-bg:rgba(245,158,11,.16); --err:#ef4444; --err-bg:rgba(239,68,68,.16);
      --acc:#38bdf8; --acc-soft:rgba(56,189,248,.12); --shadow:0 4px 16px rgba(0,0,0,.28);
    }
    * { box-sizing:border-box; }
    body { margin:0; font-family:'Inter',system-ui,-apple-system,sans-serif; background:var(--bg); color:var(--text); line-height:1.45; transition:background .15s,color .15s; }
    .topbar { position:sticky; top:0; z-index:20; background:var(--card); border-bottom:1px solid var(--line); padding:12px 24px; backdrop-filter:blur(8px); }
    .topbar-inner { max-width:1260px; margin:0 auto; display:flex; justify-content:space-between; align-items:center; gap:12px; flex-wrap:wrap; }
    .brand { display:flex; align-items:center; gap:10px; }
    .logo { width:34px; height:34px; border-radius:10px; background:linear-gradient(135deg,#2563eb,#06b6d4); color:#fff; display:grid; place-items:center; font-weight:800; font-size:17px; }
    .brand h1 { margin:0; font-size:18px; letter-spacing:-.02em; }
    .pill-status { display:inline-flex; align-items:center; gap:6px; font-size:12px; font-weight:600; padding:3px 10px; border-radius:999px; background:var(--card2); border:1px solid var(--line); color:var(--muted); }
    .dot { width:8px; height:8px; border-radius:50%; background:var(--ok); }
    .dot.busy { background:var(--warn); animation:pulse 1.2s infinite; }
    @keyframes pulse { 0%,100%{opacity:1} 50%{opacity:.35} }

    .wrap { max-width:1260px; margin:0 auto; padding:20px 24px 40px; }
    .kpis { display:grid; grid-template-columns:repeat(auto-fit,minmax(190px,1fr)); gap:12px; margin-bottom:18px; }
    .kpi { background:var(--card); border:1px solid var(--line); border-radius:12px; padding:14px 16px; box-shadow:var(--shadow); }
    .kpi .k-lbl { font-size:12px; color:var(--muted); font-weight:600; }
    .kpi .k-val { font-size:20px; font-weight:700; margin-top:4px; }

    .deck { display:grid; grid-template-columns:1.1fr 1fr; gap:16px; margin-bottom:18px; }
    @media (max-width:920px) { .deck { grid-template-columns:1fr; } }

    .card { background:var(--card); border:1px solid var(--line); border-radius:14px; padding:16px; box-shadow:var(--shadow); }
    .card-title { font-size:14px; font-weight:700; margin:0 0 12px; display:flex; justify-content:space-between; align-items:center; }
    .row { display:flex; flex-wrap:wrap; gap:8px; align-items:center; }
    .stack { display:flex; flex-direction:column; gap:10px; }
    .field-grid { display:grid; grid-template-columns:80px 1fr 1fr; gap:8px; align-items:center; }
    .prov-dd { position:relative; }
    .prov-btn { width:100%; display:flex; align-items:center; justify-content:space-between; gap:7px; border:1px solid var(--line); border-radius:9px; background:var(--input); color:var(--text); padding:7px 10px; font-weight:500; cursor:pointer; }
    .prov-btn:hover { background:var(--input); border-color:var(--acc); }
    .prov-btn-l { display:flex; align-items:center; gap:7px; min-width:0; }
    .prov-menu { position:absolute; top:calc(100% + 4px); left:0; right:0; background:var(--card); border:1px solid var(--line); border-radius:10px; box-shadow:0 12px 28px rgba(0,0,0,.18); padding:4px; z-index:40; display:none; max-height:240px; overflow-y:auto; }
    .prov-menu.open { display:block; }
    .prov-opt { display:flex; align-items:center; gap:8px; padding:7px 9px; border-radius:7px; cursor:pointer; font-size:13px; }
    .prov-opt:hover { background:var(--acc-soft); }
    .prov-opt.sel { background:var(--acc-soft); font-weight:700; color:var(--acc); }
    .prov-ico { display:inline-flex; align-items:center; justify-content:center; width:18px; height:18px; flex-shrink:0; }
    @media (max-width:560px) { .field-grid { grid-template-columns:1fr; } }

    input, select, textarea, button {
      font-family:inherit; font-size:13px; border-radius:9px; border:1px solid var(--line);
      background:var(--input); color:var(--text); padding:8px 11px; transition:border-color .15s,background .15s;
    }
    input:focus, select:focus, textarea:focus { outline:none; border-color:var(--acc); }
    textarea { resize:vertical; min-height:60px; }
    button { cursor:pointer; background:var(--btn); font-weight:600; display:inline-flex; align-items:center; gap:5px; }
    button:hover { background:var(--btn-hover); }
    button.primary { background:var(--acc); border-color:var(--acc); color:#fff; }
    button.primary:hover { filter:brightness(1.08); }
    button.danger { background:var(--err-bg); border-color:transparent; color:var(--err); }
    button.danger:hover { background:var(--err); color:#fff; }
    button.sm { padding:5px 9px; font-size:12px; border-radius:7px; }
    a.nav-link { color:var(--acc); text-decoration:none; font-size:13px; font-weight:600; padding:6px 10px; border-radius:8px; background:var(--acc-soft); }

    .q-banner { background:var(--card); border:2px solid var(--warn); border-radius:14px; padding:16px; margin-bottom:18px; box-shadow:var(--shadow); }
    .projects-grid { display:grid; grid-template-columns:repeat(auto-fill,minmax(360px,1fr)); gap:16px; }
    @media (max-width:440px) { .projects-grid { grid-template-columns:1fr; } }
    .proj { display:flex; flex-direction:column; gap:10px; }
    .proj-head { display:flex; justify-content:space-between; align-items:flex-start; gap:8px; }
    .proj-name { font-size:16px; font-weight:700; margin:0; }
    .proj-sub { font-size:12px; color:var(--muted); margin-top:2px; }
    .badge { font-size:11px; font-weight:700; padding:3px 9px; border-radius:999px; text-transform:uppercase; white-space:nowrap; }
    .b-ok { background:var(--ok-bg); color:var(--ok); }
    .b-warn { background:var(--warn-bg); color:var(--warn); }
    .b-err { background:var(--err-bg); color:var(--err); }

    .stats-strip { display:flex; gap:10px; font-size:12px; color:var(--muted); background:var(--card2); padding:7px 10px; border-radius:8px; border:1px solid var(--line); }
    .preview-wrap { border-radius:10px; overflow:hidden; border:1px solid var(--line); background:var(--card2); }
    img.preview { width:100%; height:165px; object-fit:cover; display:block; }
    .btn-group { display:flex; flex-wrap:wrap; gap:6px; }
    .btn-group-sep { border-top:1px solid var(--line); padding-top:8px; display:flex; justify-content:space-between; flex-wrap:wrap; gap:6px; }

    .feed-card { margin-top:18px; }
    pre { margin:0; background:var(--pre); color:var(--pre-text); border-radius:10px; padding:12px; font-size:12px; font-family:'JetBrains Mono',Consolas,monospace; overflow:auto; max-height:220px; white-space:pre-wrap; }
    table { width:100%; border-collapse:collapse; font-size:12px; margin-bottom:12px; }
    th, td { text-align:left; padding:7px 9px; border-bottom:1px solid var(--line); }
    th { background:var(--card2); font-weight:700; }

    .modal-bg { position:fixed; inset:0; background:rgba(15,23,42,.55); display:none; place-items:center; padding:16px; z-index:50; }
    .modal { width:min(880px,100%); max-height:90vh; overflow:auto; background:var(--card); border:1px solid var(--line); border-radius:16px; padding:18px; box-shadow:0 20px 50px rgba(0,0,0,.3); }
    .tpl-stage { background:var(--card2); border:1px solid var(--line); border-radius:12px; padding:10px; display:flex; justify-content:center; }
    .tpl-frame { width:100%; height:310px; border:1px solid var(--line); border-radius:10px; background:#fff; transition:width .2s ease; }
    .toast { position:fixed; right:20px; bottom:20px; background:var(--text); color:var(--bg); padding:10px 15px; border-radius:10px; font-size:13px; font-weight:600; display:none; z-index:60; box-shadow:0 10px 25px rgba(0,0,0,.25); }
  </style>
</head>
<body>
  <header class="topbar">
    <div class="topbar-inner">
      <div class="brand">
        <div class="logo">⚡</div>
        <div>
          <h1>DualLoop</h1>
          <div class="pill-status"><span id="runDot" class="dot"></span><span id="runText">IDLE</span></div>
        </div>
      </div>
      <div class="row">
        <a class="nav-link" href="/docs/architecture.html" target="_blank">Architecture ↗</a>
        <button id="langBtn" class="sm" onclick="toggleLang()">🌐 TH</button>
        <button id="themeBtn" class="sm" onclick="toggleTheme()">🌙 Dark</button>
        <button class="sm" onclick="loadData()">↻ Refresh</button>
      </div>
    </div>
  </header>

  <main class="wrap">
    <section class="kpis">
      <div class="kpi"><div class="k-lbl" id="lblTotal">โปรเจกต์ทั้งหมด</div><div class="k-val" id="kpiTotal">0</div></div>
      <div class="kpi"><div class="k-lbl" id="lblOnline">PM2 Online</div><div class="k-val" id="kpiOnline" style="color:var(--ok)">0</div></div>
      <div class="kpi"><div class="k-lbl" id="lblQueue">คิวงานรอ</div><div class="k-val" id="kpiQueue">0</div></div>
      <div class="kpi"><div class="k-lbl" id="lblDisk">พื้นที่ Disk</div><div class="k-val" id="kpiDisk" style="font-size:15px;">-</div></div>
    </section>

    <section class="deck">
      <div class="card stack">
        <div class="card-title"><span id="titleNew">🚀 สร้างโปรเจกต์ใหม่</span></div>
        <div class="row">
          <input id="appName" placeholder="ชื่อโปรเจกต์ (เช่น todo-app)" />
          <select id="tplSel" style="max-width:175px;" onchange="if(this.value)openTplPreview(this.value)">
            <option value="">Template: None</option>
            <option value="crud-sqlite">📋 crud-sqlite</option>
            <option value="auth-app">🔐 auth-app</option>
            <option value="dashboard">📊 dashboard</option>
            <option value="landing">🌐 landing</option>
            <option value="ecommerce">🛒 ecommerce</option>
            <option value="booking">📅 booking</option>
            <option value="kanban">📌 kanban</option>
            <option value="pos">🧾 pos</option>
            <option value="helpdesk">🎫 helpdesk</option>
            <option value="blog-cms">✍️ blog-cms</option>
          </select>
          <button type="button" id="btnTplPrev" class="sm" onclick="openTplPreview(document.getElementById('tplSel').value || 'crud-sqlite')">👁️ ตัวอย่าง</button>
        </div>
        <textarea id="appConcept" oninput="this.dataset.fromTpl='0'" placeholder="อธิบาย Concept, ฟีเจอร์, หรือ Tech Stack ที่ต้องการ..."></textarea>
        <div class="row" style="justify-content:flex-end;">
          <button id="btnCreate" class="primary" onclick="createNew()">+ สร้างโปรเจกต์ใหม่</button>
        </div>
      </div>

      <div class="card stack">
        <div class="card-title">
          <span id="titleAi">🤖 ตั้งค่า Dual-AI Engine</span>
          <label class="pill-status" style="cursor:pointer;"><input type="checkbox" id="autoFb" style="min-width:auto;margin:0;" /> Auto-Fallback</label>
        </div>
        <div class="field-grid">
          <span class="k-lbl">Backend</span>
          <div class="prov-dd" id="beDd">
            <input type="hidden" id="beProv" value="claude-cli" />
            <button type="button" class="prov-btn" onclick="toggleProvMenu('be',event)"><span class="prov-btn-l"><span id="beIcon" class="prov-ico"></span><span id="beLabel">claude-cli</span></span><span>▾</span></button>
            <div id="beMenu" class="prov-menu"></div>
          </div>
          <select id="beModelSel" onchange="onModelPick('be')"></select>
        </div>
        <input id="beModelCustom" placeholder="Backend Custom Model ID" style="display:none;" />
        <div class="field-grid">
          <span class="k-lbl">Frontend</span>
          <div class="prov-dd" id="feDd">
            <input type="hidden" id="feProv" value="agy" />
            <button type="button" class="prov-btn" onclick="toggleProvMenu('fe',event)"><span class="prov-btn-l"><span id="feIcon" class="prov-ico"></span><span id="feLabel">agy</span></span><span>▾</span></button>
            <div id="feMenu" class="prov-menu"></div>
          </div>
          <select id="feModelSel" onchange="onModelPick('fe')"></select>
        </div>
        <input id="feModelCustom" placeholder="Frontend Custom Model ID" style="display:none;" />
        <div class="row" style="justify-content:flex-end;margin-top:auto;">
          <button id="btnSaveAi" onclick="saveAiConfig()">บันทึกการตั้งค่า AI</button>
        </div>
      </div>
    </section>

    <div id="questionBanner" class="q-banner" style="display:none;"></div>

    <section id="projectsGrid" class="projects-grid"></section>

    <section class="card feed-card">
      <div class="card-title">
        <span>📡 Live Activity Feed (Phase 1 → 4)</span>
        <button class="sm" onclick="document.getElementById('feedBox').textContent=''">Clear</button>
      </div>
      <pre id="feedBox"></pre>
    </section>
  </main>

  <div id="modalBg" class="modal-bg" onclick="if(event.target===this)closeModal()">
    <div class="modal">
      <div class="card-title">
        <span id="modalTitle">Modal</span>
        <button class="sm" onclick="closeModal()">✕</button>
      </div>
      <div id="modalBody"></div>
    </div>
  </div>
  <div id="toast" class="toast"></div>

  <script>
    const UI_TXT = {
      th: {
        total: 'โปรเจกต์ทั้งหมด', online: 'PM2 Online', queue: 'คิวงานรอ', disk: 'พื้นที่ Disk',
        titleNew: '🚀 สร้างโปรเจกต์ใหม่', titleAi: '🤖 ตั้งค่า Dual-AI Engine',
        namePh: 'ชื่อโปรเจกต์ (เช่น todo-app)', conceptPh: 'อธิบาย Concept, ฟีเจอร์, หรือ Tech Stack ที่ต้องการ...',
        create: '+ สร้างโปรเจกต์ใหม่', saveAi: 'บันทึกการตั้งค่า AI', savedAi: 'บันทึกค่า AI ชั่วคราวแล้ว',
        empty: 'ยังไม่มีโปรเจกต์ (สร้างด้านบน หรือพิมพ์ /new ใน Telegram)',
        qTitle: '❓ คำถามรอคำตอบ:', customBtn: '✏️ พิมพ์ตอบเอง', cancelBtn: '❌ ยกเลิก',
        contTitle: '➕ ต่อยอด / แก้ไขโปรเจกต์:', contPh: 'ระบุฟีเจอร์ที่อยากเพิ่มหรือจุดที่ต้องการแก้...',
        contSend: 'ส่งคำสั่งทำต่อ', metaTitle: '⚙️ จัดการ .env & PROJECT_RULES.md:',
        delConfirm: 'ยืนยันลบโปรเจกต์', noDb: 'ไม่พบไฟล์ SQLite (.db)', running: 'กำลังทำงาน', idle: 'พร้อมรับงาน',
        tplPrevBtn: '👁️ ตัวอย่าง', tplModalTitle: '🎨 ตัวอย่าง Template', tplUseBtn: '✓ ใช้ Template นี้ (ใส่ Concept ตัวอย่าง)', tplSelected: 'เลือก Template แล้ว:'
      },
      en: {
        total: 'Total Projects', online: 'PM2 Online', queue: 'Queued Jobs', disk: 'Disk Free',
        titleNew: '🚀 Create New Project', titleAi: '🤖 Dual-AI Engine Config',
        namePh: 'Project name (e.g. todo-app)', conceptPh: 'Describe app concept, features, or stack...',
        create: '+ Create Project', saveAi: 'Save AI Config', savedAi: 'AI config saved for session',
        empty: 'No projects yet (create above or send /new on Telegram)',
        qTitle: '❓ Pending Decision:', customBtn: '✏️ Custom Answer', cancelBtn: '❌ Cancel',
        contTitle: '➕ Continue / Update Project:', contPh: 'Describe feature to add or issue to fix...',
        contSend: 'Run Update', metaTitle: '⚙️ Manage .env & PROJECT_RULES.md:',
        delConfirm: 'Delete project', noDb: 'No SQLite (.db) file found', running: 'RUNNING', idle: 'IDLE',
        tplPrevBtn: '👁️ Preview', tplModalTitle: '🎨 Template Preview', tplUseBtn: '✓ Use This Template', tplSelected: 'Template selected:'
      }
    };

    const TPL_EXAMPLES = {
      'crud-sqlite': {
        icon: '📋',
        th: { title: 'CRUD + SQLite (จัดการข้อมูล/สต็อก)', desc: 'ตารางเพิ่ม-แก้ไข-ลบข้อมูล เชื่อม SQLite 3NF + Foreign Key พร้อมช่องค้นหา ตัวกรองหมวดหมู่ และ Export CSV', sample: 'ระบบจัดการสต็อกสินค้าและหมวดหมู่ พร้อมค้นหา แจ้งเตือนของใกล้หมด และ Export CSV' },
        en: { title: 'CRUD + SQLite Manager', desc: 'Full Create/Read/Update/Delete table backed by 3NF SQLite with FKs, search bar, and CSV export.', sample: 'Inventory & category manager with search, low-stock alerts, and CSV export' },
        stack: 'Node.js · Express · SQLite (3NF + FK)',
        body: `<header class="nav"><b>📦 StockManager</b><button class="btn">+ เพิ่มรายการใหม่</button></header>
          <div class="pad"><div class="bar"><input placeholder="🔍 ค้นหาชื่อสินค้า / รหัส..." /><span class="pill">ทั้งหมด (128)</span><span class="pill warn">ใกล้หมด (4)</span></div>
          <table><tr><th>สินค้า</th><th>หมวดหมู่</th><th>คงเหลือ</th><th>จัดการ</th></tr>
          <tr><td><b>คีย์บอร์ดไร้สาย</b></td><td>อุปกรณ์คอม</td><td><span class="ok">42 ชิ้น</span></td><td><button class="sm">แก้ไข</button> <button class="sm red">ลบ</button></td></tr>
          <tr><td><b>เมาส์สุขภาพ</b></td><td>อุปกรณ์คอม</td><td><span class="warn">3 ชิ้น</span></td><td><button class="sm">แก้ไข</button> <button class="sm red">ลบ</button></td></tr>
          <tr><td><b>โต๊ะปรับระดับ</b></td><td>เฟอร์นิเจอร์</td><td><span class="ok">18 ชิ้น</span></td><td><button class="sm">แก้ไข</button> <button class="sm red">ลบ</button></td></tr></table></div>`
      },
      'auth-app': {
        icon: '🔐',
        th: { title: 'Auth App (ระบบสมาชิก + สิทธิ์ Role)', desc: 'หน้าสมัครสมาชิก ล็อกอิน Session/JWT เข้ารหัสรหัสผ่าน แยกสิทธิ์ Admin/User พร้อมหน้าโปรไฟล์', sample: 'ระบบจองห้องประชุมบริษัท มีล็อกอินพนักงาน แยกสิทธิ์ Admin อนุมัติการจอง' },
        en: { title: 'Auth + Role Guard App', desc: 'Register/Login with JWT/Session, hashed passwords, Admin/User role guards, and profile panel.', sample: 'Company meeting room booking system with staff login and Admin approval' },
        stack: 'Node.js · SQLite (users + sessions + roles)',
        body: `<div class="center"><div class="card w320"><div style="text-align:center;margin-bottom:10px;"><div style="font-size:24px;">🔐</div><b>เข้าสู่ระบบสมาชิก</b><div class="sub">รองรับสิทธิ์ Admin / User</div></div>
          <label>อีเมลผู้ใช้งาน</label><input value="admin@company.co.th" readonly />
          <label>รหัสผ่าน</label><input type="password" value="••••••••••" readonly />
          <div style="display:flex;justify-content:space-between;font-size:11px;margin:6px 0 10px;"><span>☑ จำการเข้าสู่ระบบ</span><span class="link">สมัครสมาชิกใหม่</span></div>
          <button class="btn full">เข้าสู่ระบบ (JWT Auth)</button></div></div>`
      },
      dashboard: {
        icon: '📊',
        th: { title: 'KPI & Analytics Dashboard', desc: 'หน้าสรุปตัวเลข KPI กราฟเปรียบเทียบรายวัน/รายเดือน และตารางรายการล่าสุด ธีม Dark/Light', sample: 'แดชบอร์ดสรุปยอดขายรายวัน รายได้ตามหมวดสินค้า และออเดอร์ล่าสุดแบบเรียลไทม์' },
        en: { title: 'Analytics & KPI Dashboard', desc: 'KPI cards, interactive charts, and live order table backed by relational SQLite aggregations.', sample: 'Daily sales analytics dashboard with category breakdown and recent orders' },
        stack: 'Node.js · SQLite · REST API · Charts',
        dark: true,

    }
    function toggleTheme() {
      applyTheme((document.documentElement.getAttribute('data-theme') || 'light') === 'dark' ? 'light' : 'dark');
    }
    applyTheme(localStorage.getItem('dualloop-theme') || 'light');

    function toast(msg) {
      const el = document.getElementById('toast');
      el.textContent = msg;
      el.style.display = 'block';
      setTimeout(() => { el.style.display = 'none'; }, 2400);
    }

    function openModal(title, html) {
      document.getElementById('modalTitle').textContent = title;
      document.getElementById('modalBody').innerHTML = html;
      document.getElementById('modalBg').style.display = 'grid';
    }
    function closeModal() { document.getElementById('modalBg').style.display = 'none'; }

    const PROVIDERS = ['claude-cli', 'agy', 'gemini-cli', 'codex-cli', 'anthropic', 'gemini', 'openai', 'openrouter', 'ollama', 'custom'];
    function provLogoSvg(prov, uid) {
      const g = `g-${uid}`;
      const logos = {
        'claude-cli': `<svg viewBox="0 0 24 24" width="18" height="18"><g stroke="#D97757" stroke-width="2.1" stroke-linecap="round"><line x1="12" y1="2.5" x2="12" y2="21.5"/><line x1="2.5" y1="12" x2="21.5" y2="12"/><line x1="5.3" y1="5.3" x2="18.7" y2="18.7"/><line x1="18.7" y1="5.3" x2="5.3" y2="18.7"/><line x1="8.4" y1="3.2" x2="15.6" y2="20.8"/><line x1="20.8" y1="8.4" x2="3.2" y2="15.6"/></g><circle cx="12" cy="12" r="2.2" fill="#D97757"/></svg>`,
        anthropic: `<svg viewBox="0 0 24 24" width="18" height="18" fill="#D97757"><path d="M14.2 4h-2.9l5.9 16h2.9L14.2 4zm-5.4 0L3 20h2.9l1.2-3.5h5.7l1.2 3.5h2.9L11.1 4H8.8zm-.7 10 1.8-5.3 1.8 5.3H8.1z"/></svg>`,
        gemini: `<svg viewBox="0 0 24 24" width="18" height="18"><defs><linearGradient id="${g}" x1="0%" y1="0%" x2="100%" y2="100%"><stop offset="0%" stop-color="#4285F4"/><stop offset="55%" stop-color="#9B72CB"/><stop offset="100%" stop-color="#D96570"/></linearGradient></defs><path fill="url(#${g})" d="M12 2c.6 5.2 4.8 9.4 10 10-5.2.6-9.4 4.8-10 10-.6-5.2-4.8-9.4-10-10 5.2-.6 9.4-4.8 10-10z"/></svg>`,
        agy: `<svg viewBox="0 0 24 24" width="18" height="18"><defs><linearGradient id="${g}-a" x1="0%" y1="100%" x2="100%" y2="0%"><stop offset="0%" stop-color="#2563EB"/><stop offset="50%" stop-color="#06B6D4"/><stop offset="100%" stop-color="#8B5CF6"/></linearGradient></defs><path fill="url(#${g}-a)" d="M12 2.5 3 20.5h4.3l1.9-4h5.6l1.9 4H21L12 2.5zm0 6.3 2 4.5h-4l2-4.5z"/><circle cx="19" cy="5.5" r="2" fill="#34A853"/></svg>`,
        openai: `<svg viewBox="0 0 24 24" width="18" height="18" fill="none" stroke="currentColor" stroke-width="1.65" stroke-linejoin="round"><path d="M12 3.2a4.4 4.4 0 0 1 4.1 2.8 4.4 4.4 0 0 1 3.7 6 4.4 4.4 0 0 1-1.9 6.5 4.4 4.4 0 0 1-5.9 2.3 4.4 4.4 0 0 1-6.5-1.9 4.4 4.4 0 0 1-2.3-5.9 4.4 4.4 0 0 1 1.9-6.5A4.4 4.4 0 0 1 12 3.2z"/><polygon points="12,8.4 15.1,10.2 15.1,13.8 12,15.6 8.9,13.8 8.9,10.2"/><path d="M12 8.4V4.2M15.1 10.2l3.6-2.1M15.1 13.8l3.6 2.1M12 15.6v4.2M8.9 13.8l-3.6 2.1M8.9 10.2L5.3 8.1"/></svg>`,
        openrouter: `<svg viewBox="0 0 24 24" width="18" height="18" fill="none" stroke="#6366F1" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="5" cy="12" r="2.2" fill="#6366F1"/><circle cx="19" cy="6" r="2.2" fill="#6366F1"/><circle cx="19" cy="18" r="2.2" fill="#6366F1"/><path d="M7.2 12H11l3-6h2.8M11 12l3 6h2.8"/></svg>`,
        ollama: `<svg viewBox="0 0 24 24" width="18" height="18"><rect width="24" height="24" rx="6" fill="#18181B"/><path fill="#FFF" d="M8.5 5.5c.8 0 1.4 1 1.6 2.3a6 6 0 0 1 3.8 0c.2-1.3.8-2.3 1.6-2.3.9 0 1.5 1.4 1.3 3.2A5.3 5.3 0 0 1 18 13v4.5c0 1.4-1.3 2.5-3 2.5H9c-1.7 0-3-1.1-3-2.5V13a5.3 5.3 0 0 1 1.2-4.3c-.2-1.8.4-3.2 1.3-3.2z"/><circle cx="10" cy="12.5" r="1" fill="#18181B"/><circle cx="14" cy="12.5" r="1" fill="#18181B"/><ellipse cx="12" cy="15.2" rx="1.6" ry="1.1" fill="#D4D4D8"/></svg>`,
        custom: `<svg viewBox="0 0 24 24" width="18" height="18" fill="none" stroke="#64748B" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="3"/><path d="M19.4 15a1.6 1.6 0 0 0 .3 1.8l.1.1a2 2 0 1 1-2.8 2.8l-.1-.1a1.6 1.6 0 0 0-1.8-.3 1.6 1.6 0 0 0-1 1.5V21a2 2 0 1 1-4 0v-.2a1.6 1.6 0 0 0-1-1.5 1.6 1.6 0 0 0-1.8.3l-.1.1a2 2 0 1 1-2.8-2.8l.1-.1a1.6 1.6 0 0 0 .3-1.8 1.6 1.6 0 0 0-1.5-1H3a2 2 0 1 1 0-4h.2a1.6 1.6 0 0 0 1.5-1 1.6 1.6 0 0 0-.3-1.8l-.1-.1a2 2 0 1 1 2.8-2.8l.1.1a1.6 1.6 0 0 0 1.8.3h.1a1.6 1.6 0 0 0 1-1.5V3a2 2 0 1 1 4 0v.2a1.6 1.6 0 0 0 1 1.5 1.6 1.6 0 0 0 1.8-.3l.1-.1a2 2 0 1 1 2.8 2.8l-.1.1a1.6 1.6 0 0 0-.3 1.8v.1a1.6 1.6 0 0 0 1.5 1H21a2 2 0 1 1 0 4h-.2a1.6 1.6 0 0 0-1.4 1z"/></svg>`
      };
      logos['gemini-cli'] = logos.gemini;
      logos['codex-cli'] = logos.openai.replace(/currentColor/g, '#10A37F');
      return logos[prov] || logos.custom;
    }
    function renderProvIcon(side, prov) {
      const iconEl = document.getElementById(side + 'Icon');
      const lblEl = document.getElementById(side + 'Label');
      const menuEl = document.getElementById(side + 'Menu');
      if (iconEl) iconEl.innerHTML = provLogoSvg(prov, `${side}-cur`);
      if (lblEl) lblEl.textContent = prov;
      if (menuEl) {
        menuEl.innerHTML = PROVIDERS.map(p =>
          `<div class="prov-opt ${p === prov ? 'sel' : ''}" onclick="pickProv('${side}','${p}')"><span class="prov-ico">${provLogoSvg(p, `${side}-${p}`)}</span><span>${p}</span></div>`
        ).join('');
      }
    }
    function toggleProvMenu(side, ev) {
      ev.stopPropagation();
      const target = document.getElementById(side + 'Menu');
      const open = target.classList.contains('open');
      document.querySelectorAll('.prov-menu').forEach(m => m.classList.remove('open'));
      if (!open) target.classList.add('open');
    }
    function pickProv(side, prov) {
      document.getElementById(side + 'Prov').value = prov;
      document.getElementById(side + 'Menu').classList.remove('open');
      syncModels(side);
    }
    document.addEventListener('click', () => document.querySelectorAll('.prov-menu').forEach(m => m.classList.remove('open')));
    renderProvIcon('be', 'claude-cli');
    renderProvIcon('fe', 'agy');
    function syncModels(side, preferredVal) {
      const prov = document.getElementById(side + 'Prov').value;
      renderProvIcon(side, prov);
      const sel = document.getElementById(side + 'ModelSel');
      const customInp = document.getElementById(side + 'ModelCustom');
      const list = MODEL_PRESETS[prov] || [];
      sel.innerHTML = list.map(m => `<option value="${esc(m)}">${esc(m)}</option>`).join('') + '<option value="__custom__">Custom...</option>';
      if (preferredVal && !list.includes(preferredVal)) {
        sel.value = '__custom__';
        customInp.style.display = 'block';
        customInp.value = preferredVal;
      } else {
        sel.value = preferredVal || list[0] || '__custom__';
        customInp.style.display = sel.value === '__custom__' ? 'block' : 'none';
      }
    }
    function onModelPick(side) {
      const sel = document.getElementById(side + 'ModelSel');
      document.getElementById(side + 'ModelCustom').style.display = sel.value === '__custom__' ? 'block' : 'none';
    }
    function getSelectedModel(side) {
      const sel = document.getElementById(side + 'ModelSel').value;
      return sel === '__custom__' ? document.getElementById(side + 'ModelCustom').value.trim() : sel;
    }

    async function loadAiConfig() {
      const r = await fetch('/api/ai-config');
      if (!r.ok) return;
      const c = await r.json();
      document.getElementById('beProv').value = c.backendProvider;
      syncModels('be', c.backendModel);
      document.getElementById('feProv').value = c.frontendProvider;
      syncModels('fe', c.frontendModel);
      document.getElementById('autoFb').checked = Boolean(c.autoFallback);
    }

    async function saveAiConfig() {
      const r = await fetch('/api/ai-config', {
        method: 'POST',
        headers: { 'content-type': 'application/json' },
        body: JSON.stringify({
          backendProvider: document.getElementById('beProv').value,
          backendModel: getSelectedModel('be'),
          frontendProvider: document.getElementById('feProv').value,
          frontendModel: getSelectedModel('fe'),
          autoFallback: document.getElementById('autoFb').checked
        })
      });
      if (r.ok) toast(UI_TXT[curLang].savedAi);
    }

    async function act(slug, action) {
      const r = await fetch('/api/action', {
        method: 'POST',
        headers: { 'content-type': 'application/json' },
        body: JSON.stringify({ slug, action })
      });
      const j = await r.json();
      if (!r.ok) return toast(j.error || 'Failed');
      toast(`${action}: ${slug}`);
      loadData();
    }

    async function viewLogs(slug) {
      const r = await fetch(`/api/logs/${encodeURIComponent(slug)}`);
      const j = await r.json();
      openModal(`PM2 Logs: ${slug}`, `<pre>${esc(j.logs || '(empty)')}</pre>`);
    }

    async function viewDb(slug) {
      const r = await fetch(`/api/db/${encodeURIComponent(slug)}`);
      const j = await r.json();
      if (!j.found) return openModal(`DB: ${slug}`, `<p class="meta">${UI_TXT[curLang].noDb}</p>`);
      const html = j.tables.map(t => {
        if (!t.rows.length) return `<h4>${esc(t.name)} (0 rows)</h4>`;
        const cols = Object.keys(t.rows[0]);
        return `<h4>${esc(t.name)} (${t.rows.length})</h4><div style="overflow:auto;"><table><tr>${cols.map(c => `<th>${esc(c)}</th>`).join('')}</tr>` +
          t.rows.map(row => `<tr>${cols.map(c => `<td>${esc(row[c])}</td>`).join('')}</tr>`).join('') + '</table></div>';
      }).join('');
      openModal(`🗄️ ${j.dbFile} (${slug})`, html);
    }

    function openContinue(slug) {
      const u = UI_TXT[curLang];
      openModal(`${u.contTitle} ${slug}`, `
        <div class="stack">
          <textarea id="contInp" placeholder="${u.contPh}"></textarea>
          <div class="row" style="justify-content:flex-end;">
            <button class="primary" onclick="submitContinue('${slug}')">${u.contSend}</button>
          </div>
        </div>`);
    }

    async function submitContinue(slug) {
      const instruction = document.getElementById('contInp').value.trim();
      if (!instruction) return;
      const r = await fetch('/api/continue', {
        method: 'POST',
        headers: { 'content-type': 'application/json' },
        body: JSON.stringify({ slug, instruction })
      });
      closeModal();
      if (r.ok) toast(`Queued update: ${slug}`);
      loadData();
    }

    async function openMeta(slug) {
      const r = await fetch(`/api/project-meta/${encodeURIComponent(slug)}`);
      const j = await r.json();
      openModal(`${UI_TXT[curLang].metaTitle} ${slug}`, `
        <div class="stack">
          <div class="k-lbl">.env (masked)</div>
          <pre>${esc(j.envMasked)}</pre>
          <div class="row">
            <input id="envKeyInp" placeholder="KEY" style="max-width:160px;" />
            <input id="envValInp" placeholder="VALUE" />
            <button onclick="saveEnvKey('${slug}')">Update .env</button>
          </div>
          <div class="k-lbl">PROJECT_RULES.md</div>
          <pre>${esc(j.rules || '(none)')}</pre>
          <div class="row">
            <input id="ruleInp" placeholder="Add project rule..." />
            <button onclick="saveRule('${slug}')">Add Rule</button>
          </div>
        </div>`);
    }

    async function saveEnvKey(slug) {
      const envKey = document.getElementById('envKeyInp').value.trim();
      const envVal = document.getElementById('envValInp').value.trim();
      if (!envKey) return;
      await fetch('/api/project-meta', {
        method: 'POST',
        headers: { 'content-type': 'application/json' },
        body: JSON.stringify({ slug, envKey, envVal })
      });
      toast('.env updated & PM2 restarted');
      openMeta(slug);
    }

    async function saveRule(slug) {
      const rule = document.getElementById('ruleInp').value.trim();
      if (!rule) return;
      await fetch('/api/project-meta', {
        method: 'POST',
        headers: { 'content-type': 'application/json' },
        body: JSON.stringify({ slug, rule })
      });
      toast('Rule added');
      openMeta(slug);
    }

    async function createNew() {
      const name = document.getElementById('appName').value.trim();
      const tpl = document.getElementById('tplSel').value;
      let concept = document.getElementById('appConcept').value.trim() || name;
      if (!name) return toast('Name required');
      if (tpl) concept = `[Template: ${tpl}] ${concept}`;
      const r = await fetch('/api/new', {
        method: 'POST',
        headers: { 'content-type': 'application/json' },
        body: JSON.stringify({ name, concept })
      });
      const j = await r.json();
      if (!r.ok) return toast(j.error || 'Failed');
      document.getElementById('appName').value = '';
      document.getElementById('appConcept').value = '';
      toast(`Queued: ${j.slug}`);
      loadData();
    }

    let activeQuestion = null;
    function renderQuestions(list) {
      activeQuestion = list && list.length ? list[0] : null;
      const box = document.getElementById('questionBanner');
      if (!activeQuestion) { box.style.display = 'none'; return; }
      const q = activeQuestion;
      const u = UI_TXT[curLang];
      box.style.display = 'block';
      const opts = q.options.map((o, i) =>
        q.allowMultiple
          ? `<label style="display:flex;align-items:center;gap:6px;"><input type="checkbox" name="qopt" value="${esc(o)}" style="min-width:auto;"/> ${esc(o)}</label>`
          : `<button class="primary" onclick="submitWebAns('${q.id}', ${i})">${esc(o)}</button>`
      ).join(' ');
      box.innerHTML = `
        <div style="margin-bottom:10px;font-weight:700;">${u.qTitle} ${esc(q.question)}</div>
        <div class="row" style="gap:8px;">
          ${opts}
          ${q.allowMultiple ? `<button class="primary" onclick="submitWebMulti('${q.id}')">Submit</button>` : ''}
          ${q.allowCustom ? `<button onclick="submitWebCustom('${q.id}')">${u.customBtn}</button>` : ''}
          ${q.allowCancel ? `<button class="danger" onclick="submitWebCancel('${q.id}')">${u.cancelBtn}</button>` : ''}
        </div>`;
    }

    async function sendWebAns(id, answer, cancel = false) {
      await fetch('/api/answer', {
        method: 'POST',
        headers: { 'content-type': 'application/json' },
        body: JSON.stringify({ id, answer, cancel })
      });
      loadData();
    }
    function submitWebAns(id, idx) { sendWebAns(id, activeQuestion.options[idx]); }
    function submitWebMulti(id) {
      const vals = [...document.querySelectorAll('input[name="qopt"]:checked')].map(el => el.value);
      sendWebAns(id, vals.length ? vals.join(', ') : activeQuestion.options[0]);
    }
    function submitWebCustom(id) {
      openModal(UI_TXT[curLang].customBtn, `
        <div class="stack">
          <div>${esc(activeQuestion.question)}</div>
          <input id="customAnsInp" />
          <div class="row" style="justify-content:flex-end;">
            <button class="primary" onclick="const v=document.getElementById('customAnsInp').value.trim();if(v){closeModal();sendWebAns('${id}',v);}">OK</button>
          </div>
        </div>`);
    }
    function submitWebCancel(id) { sendWebAns(id, '', true); }

    async function loadData() {
      const res = await fetch('/api/projects');
      const data = await res.json();
      if (data.lang && data.lang !== curLang) applyLang(data.lang);
      renderQuestions(data.pendingQuestions || []);

      const onlineCount = data.projects.filter(p => p.pm2Status === 'online').length;
      document.getElementById('kpiTotal').textContent = data.projects.length;
      document.getElementById('kpiOnline').textContent = onlineCount;
      document.getElementById('kpiQueue').textContent = data.queueSize;
      document.getElementById('kpiDisk').textContent = data.disk || '-';

      const dot = document.getElementById('runDot');
      dot.className = data.running ? 'dot busy' : 'dot';
      document.getElementById('runText').textContent = data.running ? UI_TXT[curLang].running : UI_TXT[curLang].idle;

      const grid = document.getElementById('projectsGrid');
      if (!data.projects.length) {
        grid.innerHTML = `<div class="card">${UI_TXT[curLang].empty}</div>`;
        return;
      }

      grid.innerHTML = data.projects.map(p => {
        const cls = p.pm2Status === 'online' ? 'b-ok' : (p.phase === 'error' ? 'b-err' : 'b-warn');
        return `
          <article class="card proj">
            <div class="proj-head">
              <div>
                <h3 class="proj-name">${esc(p.name)}</h3>
                <div class="proj-sub"><code>${esc(p.slug)}</code> · <a href="http://127.0.0.1:${p.port}" target="_blank" style="color:var(--acc);text-decoration:none;font-weight:600;">:${p.port} ↗</a></div>
              </div>
              <span class="badge ${cls}">${esc(p.phase)} · ${esc(p.pm2Status)}</span>
            </div>
            <div class="stats-strip">
              <span>BE: <strong>${p.metrics?.aiCalls?.backend || 0}</strong></span>
              <span>FE: <strong>${p.metrics?.aiCalls?.frontend || 0}</strong></span>
              <span>Fix: <strong>${p.metrics?.totalFixLoops || 0}</strong></span>
            </div>
            ${p.hasPreview ? `<div class="preview-wrap"><img class="preview" src="/api/preview/${encodeURIComponent(p.slug)}?t=${Date.now()}" alt="preview"/></div>` : ''}
            <div class="btn-group">
              <button class="sm" onclick="act('${p.slug}','restart')">Restart</button>
              <button class="sm" onclick="act('${p.slug}','stop')">Stop</button>
              <button class="sm" onclick="act('${p.slug}','resume')">Resume</button>
              <button class="sm primary" onclick="openContinue('${p.slug}')">+ Continue</button>
            </div>
            <div class="btn-group-sep">
              <div class="btn-group">
                <button class="sm" onclick="viewDb('${p.slug}')">DB</button>
                <button class="sm" onclick="openMeta('${p.slug}')">Env &amp; Rules</button>
                <button class="sm" onclick="viewLogs('${p.slug}')">Logs</button>
                <button class="sm" onclick="window.open('/api/project-docs/${encodeURIComponent(p.slug)}/architecture.html','_blank')">Flow/Docs</button>
                <button class="sm" onclick="window.open('/api/project-docs/${encodeURIComponent(p.slug)}/api-tester.html','_blank')">API Tester</button>
                <button class="sm" onclick="window.open('/api/project-docs/${encodeURIComponent(p.slug)}/test-report.html','_blank')">Test Report</button>
              </div>
              <div class="btn-group">
                <button class="sm" onclick="act('${p.slug}','rollback')">Rollback</button>
                <button class="sm danger" onclick="if(confirm('${UI_TXT[curLang].delConfirm} ${p.slug}?')) act('${p.slug}','delete')">Delete</button>
              </div>
            </div>
          </article>`;
      }).join('');
    }

    function esc(s) {
      return String(s || '').replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
    }

    loadAiConfig();
    loadData();
    setInterval(loadData, 15000);

    let reloadTimer = null;
    const scheduleReload = () => {
      clearTimeout(reloadTimer);
      reloadTimer = setTimeout(loadData, 600);
    };

    const es = new EventSource('/api/events');
    es.onmessage = (ev) => {
      const item = JSON.parse(ev.data);
      if (item.type === 'question' || item.type === 'question_resolved') {
        scheduleReload();
        return;
      }
      const box = document.getElementById('feedBox');
      box.textContent += `[${item.ts.slice(11, 19)}] ${item.msg}\n`;
      box.scrollTop = box.scrollHeight;
      scheduleReload();
    };
  </script>
</body>
</html>
